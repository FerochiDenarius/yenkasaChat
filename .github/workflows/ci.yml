name: Yenkasa CI

on:
  push:
    branches: [main, 'improve/**']
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and quality checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yenkasaChatBackend/RegLoginBackend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: yenkasaChatBackend/RegLoginBackend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - run: npm audit --audit-level=high

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yenkasa-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: yenkasa-web/package-lock.json
      - run: npm ci
      - run: npm run build

  android:
    name: Android tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: ./gradlew test
