<!-- public/reset-password.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; }
    input, button { margin-top: 1rem; display: block; width: 100%; }
  </style>
</head>
<body>
  <h2>Reset Your Password</h2>
  <input type="password" id="newPassword" placeholder="Enter new password" />
  <button onclick="submitNewPassword()">Reset Password</button>
  <p id="message"></p>

  <script>
    const token = window.location.pathname.split('/').pop();

    async function submitNewPassword() {
      const password = document.getElementById('newPassword').value;

      const res = await fetch(`/auth/reset-password/${token}`, {
        method: 'POST',
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password })
      });

      const messageEl = document.getElementById("message");
      if (res.ok) {
        messageEl.innerText = "✅ Password successfully reset!";
      } else {
        messageEl.innerText = "❌ Failed to reset password. Link may be expired.";
      }
    }
  </script>
</body>
</html>
