<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        p {
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="password"] {
            width: calc(100% - 22px); /* Account for padding and border */
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .button {
            display: inline-block;
            background-color: #007bff;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            margin-top: 10px;
            transition: background-color 0.3s ease;
        }
        .button:hover {
            background-color: #0056b3;
        }
        .button-secondary {
            background-color: #6c757d;
        }
        .button-secondary:hover {
            background-color: #545b62;
        }
        #message {
            margin-top: 20px;
            font-weight: bold;
        }
        .hidden {
            display: none;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loadingState">
            <h2>Processing Link...</h2>
            <div class="loader"></div>
            <p>Please wait while we try to open this link in the YenkasaChat app.</p>
        </div>

        <div id="appRedirectFailedState" class="hidden">
            <h2>Reset Your Password</h2>
            <p>If you have YenkasaChat installed, the app should have opened. If not, or if you prefer to reset your password here, please enter your new password below.</p>
            <div class="form-group">
                <label for="newPassword">New Password:</label>
                <input type="password" id="newPassword" placeholder="Enter new password" />
            </div>
            <button class="button" onclick="submitNewPassword()">Reset Password</button>
            <p id="message"></p>
        </div>
    </div>

    <script>
        const loadingStateDiv = document.getElementById('loadingState');
        const appRedirectFailedStateDiv = document.getElementById('appRedirectFailedState');
        let token; // Will hold the token from the URL

        function showWebForm() {
            loadingStateDiv.classList.add('hidden');
            appRedirectFailedStateDiv.classList.remove('hidden');
        }

        function getParameterByName(name, url = window.location.href) {
            name = name.replace(/[\[\]]/g, '\\$&');
            const regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)');
            const results = regex.exec(url);
            if (!results) return null;
            if (!results[2]) return '';
            return decodeURIComponent(results[2].replace(/\+/g, ' '));
        }

        async function submitNewPassword() {
            const passwordInput = document.getElementById('newPassword');
            const messageEl = document.getElementById("message");
            
            if (!passwordInput || !passwordInput.value) {
                messageEl.style.color = "red";
                messageEl.innerText = "Please enter a new password.";
                return;
            }
            if (!token) {
                messageEl.style.color = "red";
                messageEl.innerText = "Error: Reset token is missing.";
                return;
            }

            messageEl.style.color = "#333";
            messageEl.innerText = "Processing...";

            try {
                // IMPORTANT: The backend endpoint for password reset from the web
                // might be different from the one the app uses if the app sends
                // an auth token. This example assumes a public endpoint that uses the reset token.
                // Your current server.js uses `/api/reset-password/confirm/:token`
                const res = await fetch(`/api/reset-password/confirm/${token}`, {
                    method: 'POST',
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password: passwordInput.value })
                });

                if (res.ok) {
                    const result = await res.json(); // Assuming your backend sends JSON
                    messageEl.style.color = "green";
                    messageEl.innerText = result.message || "✅ Password successfully reset!";
                    passwordInput.value = ''; // Clear the input
                } else {
                    const errorResult = await res.json().catch(() => ({ message: "Failed to reset password. Link may be invalid or expired." }));
                    messageEl.style.color = "red";
                    messageEl.innerText = `❌ ${errorResult.message}`;
                }
            } catch (error) {
                console.error("Error submitting new password:", error);
                messageEl.style.color = "red";
                messageEl.innerText = "❌ An error occurred. Please try again.";
            }
        }

        window.onload = function() {
            token = getParameterByName('token');

            if (!token) {
                console.error("No token found in URL.");
                loadingStateDiv.innerHTML = "<h2>Error</h2><p>Invalid or missing password reset link (no token found).</p>";
                // No need to call showWebForm() here as it would be confusing without a token
                return;
            }

            const appLink = `https://yenkasa.xyz/reset-password?token=${token}`; // This is the App Link
            // const customSchemeLink = `yenkasachat://reset-password/${token}`; // Your custom scheme from server.js

            // Attempt to redirect to the app via the App Link
            // Modern browsers are very restrictive about programmatic redirects to custom schemes
            // for security reasons. App Links (HTTPS) are the preferred way.
            // A common strategy is to try to open the app and if it fails (timeout), show the web content.

            // We'll set a timeout. If the page is still visible after the timeout,
            // it means the app likely didn't open (or the user came back quickly).
            let appOpened = false;

            function onVisibilityChange() {
                if (document.hidden) {
                    // Page became hidden, likely means the app opened or user switched tabs.
                    // We can assume the app link worked IF it happened quickly after trying to open.
                    // This is heuristic.
                    appOpened = true; 
                }
            }
            document.addEventListener("visibilitychange", onVisibilityChange);


            // Try to navigate to the app link. If the app is installed and verified for this domain,
            // it should open directly.
            // For a better user experience, some try to open an iframe to the custom scheme
            // and if it fails, then show the web page. However, App Links (HTTPS) are more reliable.
            // The direct window.location.href change to an HTTPS link is the standard way App Links are triggered.
            
            // On mobile, try to "re-trigger" the app link resolution by navigating to it.
            // If the app is installed and verified, it should intercept.
            // If not, the browser will just load this same page (or potentially loop if not careful).
            // To avoid loops, we use the timeout.

            const isAndroid = /android/i.test(navigator.userAgent);
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;


            if (isAndroid || isIOS) { // Primarily for mobile OSes where app linking is relevant
                 // Attempt to "re-navigate" to the app link.
                 // This gives the OS a chance to intercept it if the app is installed.
                 // We don't want to do this if this script is *already* the result of an app link.
                 // So we need a way to detect if this is the "first load" from an email vs. a reload.
                 // For now, a simple timeout approach:
                
                setTimeout(() => {
                    if (!appOpened && !document.hidden) { 
                        // If after a short delay, the page is still visible,
                        // and we didn't detect it becoming hidden, assume app didn't open.
                        console.log("App link did not seem to open the app, showing web fallback.");
                        showWebForm();
                    } else if (appOpened || document.hidden) {
                        // App likely opened, or user switched away.
                        // We might not want to show the web form in this case,
                        // or provide a "Return to app" button if they come back to this browser tab.
                        // For simplicity now, if it seemed to open, we just leave the "Processing" state.
                        // If they come back, they might see the loading state or the web form if the timeout above already triggered.
                        console.log("App link may have opened the app or user navigated away.");
                        // To avoid showing the web form if the app *did* open and the user comes back:
                        // We could potentially keep the loading state, or change the message.
                        // Or, if appOpened is true, we could even redirect to a "check your app" page.
                        // For this version, if appOpened is true or document is hidden when timeout hits, we *don't* call showWebForm.
                    }
                }, 2000); // 2 seconds timeout - adjust as needed

                // For Android, you could also try the custom scheme as a secondary attempt if desired,
                // but this is less reliable and has security implications.
                // window.location.href = customSchemeLink;
                // For this example, we rely on the HTTPS App Link.
                 if (performance.navigation.type !== performance.navigation.TYPE_RELOAD) {
                    // This is not a reload, attempt to navigate to trigger app link
                    // This also handles the case where the user lands on the page directly.
                    // If the app is installed, it should take over.
                    // If not, it will load this page.
                    // No explicit window.location.href change needed here if the user *already* landed on this URL
                    // from the email link. The OS should have already tried to resolve it.
                    // The timeout above is the main mechanism to decide when to show the web form.
                }


            } else {
                // Not Android or iOS, or detection failed, show web form immediately.
                console.log("Not detected as Android/iOS, or app redirect logic not triggered. Showing web form.");
                showWebForm();
            }

            // Fallback if the timeout doesn't catch all cases or if user navigates back to the browser tab
            // after the app has handled the link (though ideally the app would finish the flow).
            // This is a safety net.
             setTimeout(() => {
                if (loadingStateDiv.classList.contains('hidden') === false) { // if loadingState is still visible
                    console.log("Safety timeout: App link did not open or user returned. Showing web form.");
                    showWebForm();
                }
            }, 4000); // A longer timeout for this safety net

        };
    </script>
</body>
</html>
