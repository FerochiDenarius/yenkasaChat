<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yenkasa Store Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(circle at top left, rgba(184,134,11,0.18), transparent 30%),
        linear-gradient(180deg, #f8f5ef 0%, #f2f2f2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #222;
    }

    .wrapper {
      max-width: 760px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 20px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: rgba(184,134,11,0.12);
      color: #9b6b00;
      border: 1px solid rgba(184,134,11,0.2);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .header h1 {
      font-size: clamp(28px, 5vw, 40px);
      margin-bottom: 10px;
    }

    .header p {
      color: #666;
      font-size: 15px;
      line-height: 1.6;
    }

    .card {
      background: rgba(255,255,255,0.94);
      backdrop-filter: blur(14px);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 24px 50px rgba(0,0,0,0.08);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 15px 16px;
      border: 1px solid #ddd;
      border-radius: 18px;
      background: #fff;
      font-size: 15px;
      font-family: inherit;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #c99511;
      box-shadow: 0 0 0 4px rgba(184,134,11,0.15);
    }

    .upload-box {
      border: 2px dashed #d9d9d9;
      border-radius: 22px;
      padding: 18px;
      background: #fafafa;
    }

    .preview {
      display: none;
      width: 100%;
      max-width: 240px;
      margin-top: 14px;
      border-radius: 18px;
      border: 1px solid #ececec;
    }

    .image-preview-grid {
      display: none;
      margin-top: 14px;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 10px;
    }

    .image-preview-grid img {
      width: 100%;
      height: 90px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #ececec;
    }

    video.preview {
      max-width: 280px;
    }

    .action-bar {
      margin-top: 26px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .submit-btn {
      border: none;
      border-radius: 18px;
      padding: 16px;
      background: linear-gradient(135deg, #c99511, #8b5f00);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit-btn:disabled {
      opacity: 0.75;
      cursor: not-allowed;
    }

    .progress-wrap {
      display: none;
      width: 100%;
      height: 10px;
      background: #ececec;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #c99511, #f0c14d);
      animation: progressMove 1.2s linear infinite;
    }

    @keyframes progressMove {
      0% { width: 0%; }
      50% { width: 75%; }
      100% { width: 100%; }
    }

    .status-text {
      display: none;
      text-align: center;
      color: #666;
      font-size: 14px;
    }

    @media (max-width: 640px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 18px;
      }
    }

    .admin-tabs {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
}

.tab-btn {
  flex: 1;
  padding: 14px;
  border: none;
  border-radius: 14px;
  background: #ececec;
  font-weight: 700;
  cursor: pointer;
  transition: 0.2s;
}

.tab-btn.active {
  background: linear-gradient(135deg, #c99511, #8b5f00);
  color: white;
}

.manage-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 14px;
  border: 1px solid #eee;
  border-radius: 16px;
  margin-bottom: 12px;
  background: #fafafa;
}

.manage-info strong {
  display: block;
  margin-bottom: 4px;
}

.manage-info small {
  color: #666;
}

.manage-actions {
  display: flex;
  gap: 10px;
}

.manage-btn {
  border: none;
  padding: 10px 14px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 600;
}

.manage-btn.status {
  background: #c99511;
  color: white;
}

.manage-btn.delete {
  background: #d62828;
  color: white;
}

.orders-summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 22px;
}

.summary-card {
  background: #fafafa;
  border: 1px solid #eee;
  border-radius: 18px;
  padding: 18px;
  text-align: center;
}

.summary-card h3 {
  font-size: 14px;
  color: #666;
  margin-bottom: 8px;
}

.summary-card span {
  font-size: 28px;
  font-weight: 700;
  color: #8b5f00;
}

@media (max-width: 640px) {
  .orders-summary {
    grid-template-columns: 1fr;
  }
}
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="header">
      <div class="badge">Yenkasa Store Admin Panel</div>
      <h1>Add New Bale</h1>
      <p>Upload new bale details, images and videos directly from your phone or computer.</p>
    </div>

<div class="admin-tabs">
  <button class="tab-btn active" id="baleTab">Upload Bale</button>
  <button class="tab-btn" id="singleTab">Upload Single Dress</button>
  <button class="tab-btn" id="manageTab">Manage Products</button>
  <button class="tab-btn" id="ordersTab">Orders</button>
</div>

   <div class="card">
  <div class="grid">

    <input type="hidden" id="productType" value="bale">

    <div class="field">
      <label for="name">Bale Name</label>
      <input type="text" id="name" placeholder="e.g. Ladies Flannel Blouse Bale">
    </div>





        <div class="field">
          <label for="price">Price (GHS)</label>
          <input type="number" id="price" placeholder="4500">
        </div>

        <div class="field" id="weightField">
          <label for="weight">Weight</label>
          <input type="text" id="weight" placeholder="55kg">
        </div>

        <div class="field" id="sizeField" style="display:none;">
  <label for="size">Size</label>
  <select id="size">
    <option value="">Select Size</option>
    <option value="XS">XS</option>
    <option value="S">S</option>
    <option value="M">M</option>
    <option value="L">L</option>
    <option value="XL">XL</option>
    <option value="XXL">XXL</option>
  </select>
</div>

        <div class="field">
          <label for="category">Category</label>
          <input type="text" id="category" placeholder="Flannel Blouse">
        </div>

        <div class="field full">
          <label for="description">Description</label>
          <textarea id="description" placeholder="Describe the bale, quantity, grade, colours and anything buyers should know."></textarea>
        </div>

        <div class="field">
          <label for="status">Status</label>
          <select id="status">
            <option value="available">Available</option>
            <option value="preorder">Preorder</option>
            <option value="sold">Sold</option>
          </select>
        </div>

        <div class="field full">
          <label for="imageFile">📸 Bale Image</label>
          <div class="upload-box">
            <input type="file" id="imageFile" accept="image/*" multiple>
            <div id="imagePreview" class="image-preview-grid"></div>
          </div>
        </div>

        <div class="field full">
          <label for="videoFile">🎥 Bale Video (Optional)</label>
          <div class="upload-box">
            <input type="file" id="videoFile" accept="video/*">
            <video id="videoPreview" class="preview" controls></video>
          </div>
        </div>

      </div>


      <div class="action-bar">
        <button id="addBaleBtn" class="submit-btn">Upload Bale</button>

        <div class="progress-wrap" id="progressWrap">
          <div class="progress-bar"></div>
        </div>

        <div class="status-text" id="statusText">
          Uploading bale, please wait...
        </div>
      </div>

    </div>



      <div id="manageSection" style="display:none; margin-top:20px;">
  <div class="card">
    <h2 style="margin-bottom:20px;">Manage Products</h2>
    <div id="manageList"></div>
  </div>
</div>

<div id="ordersSection" style="display:none; margin-top:20px;">
  <div class="card">
    <h2 style="margin-bottom:20px;">Seller Orders</h2>

    <div class="orders-summary">
      <div class="summary-card">
        <h3>Paid</h3>
        <span id="paid-count">0</span>
      </div>

      <div class="summary-card">
        <h3>Awaiting Payment</h3>
        <span id="pending-count">0</span>
      </div>

      <div class="summary-card">
        <h3>Completed</h3>
        <span id="completed-count">0</span>
      </div>
    </div>

    <div id="sellerOrdersList"></div>
  </div>
</div>
  </div>

  <script src="../landingFile/admin.js"></script>
</body>
</html>
