<!DOCTYPE html>
<html>
<head>
  <title>Admin - Tricia Bales</title>

  <style>
    body { font-family: Arial; padding: 20px; background: #f5f5f5; }

    h2 { margin-bottom: 20px; }

    label {
      font-weight: bold;
      margin-top: 10px;
      display: block;
    }

    input, textarea, select {
      display: block;
      margin: 5px 0 10px;
      padding: 8px;
      width: 300px;
    }

    button {
      padding: 10px;
      background: green;
      color: white;
      border: none;
      cursor: pointer;
    }

    img, video {
      margin-top: 10px;
      width: 200px;
      border-radius: 10px;
      display: none;
    }

    .preview {
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

<h2>🛠 Add New Bale</h2>

<label>Bale Name</label>
<input type="text" id="name">

<label>Price (GHS)</label>
<input type="number" id="price">

<label>Weight</label>
<input type="text" id="weight">

<label>Category</label>
<input type="text" id="category">

<label>Description</label>
<textarea id="description"></textarea>

<!-- ✅ STATUS ADDED -->
<label>Status</label>
<select id="status">
  <option value="available">Available</option>
  <option value="preorder">Preorder</option>
  <option value="sold">Sold</option>
</select>

<!-- IMAGE -->
<label>📸 Select Image</label>
<input type="file" id="imageFile" accept="image/*" onchange="previewImage()">
<img id="imagePreview" class="preview">

<!-- VIDEO -->
<label>🎥 Select Video (Optional)</label>
<input type="file" id="videoFile" accept="video/*" onchange="previewVideo()">
<video id="videoPreview" class="preview" controls></video>

<button onclick="addBale()">Add Bale</button>

<script src="admin.js"></script>

<script>
  function previewImage() {
    const file = document.getElementById("imageFile").files[0];
    const preview = document.getElementById("imagePreview");

    if (file) {
      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
    }
  }

  function previewVideo() {
    const file = document.getElementById("videoFile").files[0];
    const preview = document.getElementById("videoPreview");

    if (file) {
      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
    }
  }
</script>

</body>
</html>
