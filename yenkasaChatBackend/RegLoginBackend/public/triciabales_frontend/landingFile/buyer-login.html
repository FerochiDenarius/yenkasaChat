<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Yenkasa Store</title>
  <link rel="stylesheet" href="../cssFile/style.css">
</head>
<body>

  <div class="page-brand">
    <img src="../images/YenkasaStoreLogo.png" alt="Yenkasa Store logo">
  </div>

  <section class="collection-section">
    <div class="section-header">
      <span>Welcome Back</span>
      <h2>Login</h2>
      <p>Access your buyer or seller account</p>
    </div>

    <div class="card" style="max-width:600px;margin:0 auto;">
      <div class="card-content">

        <form id="login-form" style="display:flex;flex-direction:column;gap:18px;">

          <input
            type="email"
            id="email"
            placeholder="Email Address"
            required
          >

          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          >

          <button type="submit">
            Login
          </button>

        </form>

        <p style="margin-top:20px;text-align:center;">
          Don't have an account?
          <a href="register.html">Register</a>
        </p>

        <p style="margin-top:12px;text-align:center;">
          <a href="forgot-password.html">Forgot password?</a>
        </p>

      </div>
    </div>
  </section>

  <script src="../jsFiles/buyer-login.js"></script>
</body>
</html>
