<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart | Yenkasa Store</title>
  <link rel="stylesheet" href="/store/assets/cssFile/style.css?v=20260422-dress-sizes">
</head>
<body>

  <div class="page-brand">
    <img src="/store/assets/images/YenkasaStoreLogo.png" alt="Yenkasa Store logo">
  </div>

  <section class="collection-section">
    <div class="section-header">
      <span>Your Order</span>
      <h2>Shopping Cart</h2>
      <p>Review your selected items before checkout</p>
    </div>

    <div id="cart-items"></div>

    <div id="cart-summary" style="margin-top:40px; display:none;">
      <h2 id="cart-total"></h2>

      <button
        id="checkout-btn"
        class="primary-btn"
        style="border:none; cursor:pointer;"
      >
        Proceed to Checkout
      </button>
    </div>
  </section>
  <script src="/store/assets/jsFiles/store-settings.js"></script>
  <script src="/store/assets/jsFiles/cart-page.js?v=20260422-dress-sizes"></script>
</body>
</html>
