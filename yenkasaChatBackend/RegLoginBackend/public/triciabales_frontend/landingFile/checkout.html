<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Yenkasa Store</title>
  <link rel="stylesheet" href="../cssFile/style.css">
</head>
<body>

  <div class="page-brand">
    <img src="../images/YenkasaStoreLogo.png" alt="Yenkasa Store logo">
  </div>

  <section class="collection-section">
    <div class="section-header">
      <span>Almost Done</span>
      <h2>Checkout</h2>
      <p>Enter your details to place your order</p>
    </div>

    <div class="card" style="max-width:700px;margin:0 auto;">
      <div class="card-content">

        <form id="checkout-form">
          <div style="display:flex;flex-direction:column;gap:18px;">

            <input
              type="text"
              id="customerName"
              placeholder="Your Name"
              required
              style="padding:16px;border-radius:12px;border:1px solid #d1d5db;"
            >

            <input
              type="tel"
              id="phone"
              placeholder="Phone Number"
              required
              style="padding:16px;border-radius:12px;border:1px solid #d1d5db;"
            >

            <textarea
              id="address"
              placeholder="Delivery Address"
              rows="4"
              required
              style="padding:16px;border-radius:12px;border:1px solid #d1d5db;"
            ></textarea>

            <button type="submit">
              Place Order
            </button>

          </div>
        </form>

      </div>
    </div>
  </section>

  <script src="../jsFiles/checkout.js"></script>
</body>
</html>
