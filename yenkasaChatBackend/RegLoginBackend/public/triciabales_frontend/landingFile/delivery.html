<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery Method | Yenkasa Store</title>
  <link rel="stylesheet" href="/store/assets/cssFile/style.css?v=20260416-logo-fill-cover">
</head>
<body>

  <div class="page-brand">
    <img src="/store/assets/images/YenkasaStoreLogo.png" alt="Yenkasa Store logo">
  </div>

  <section class="collection-section">
    <div class="section-header">
      <span>Step 2 of 3</span>
      <h2>Select Delivery Method</h2>
      <p>Choose how you want to receive your order</p>
    </div>

    <div class="card" style="max-width:700px;margin:0 auto;">
      <div class="card-content">

        <form id="delivery-form" style="display:flex;flex-direction:column;gap:18px;">

          <div id="delivery-estimate-box" style="background:#f9fafb;border:1px solid #d1d5db;border-radius:8px;padding:16px;">
            <strong>Delivery estimate</strong>
            <p id="delivery-estimate-status" style="margin:8px 0 0;">Checking delivery cost...</p>
            <div id="delivery-estimate-details" style="display:none;margin-top:10px;">
              <p style="margin:4px 0;"><strong>Distance:</strong> <span id="delivery-distance">-</span></p>
              <p style="margin:4px 0;"><strong>Delivery Fee:</strong> <span id="delivery-fee">-</span></p>
            </div>
          </div>

          <label style="display:flex;align-items:center;gap:12px;">
            <input type="radio" name="deliveryMethod" value="pickup" required>
            Pick Up at Oyarifa
          </label>

          <label style="display:flex;align-items:center;gap:12px;">
            <input type="radio" name="deliveryMethod" value="uber">
            Uber Delivery
          </label>

          <label style="display:flex;align-items:center;gap:12px;">
            <input type="radio" name="deliveryMethod" value="bolt">
            Bolt Delivery
          </label>

          <div id="pickup-details" style="display:none;">
            <div style="background:#f3f4f6;padding:16px;border-radius:12px;margin-top:10px;">
              <strong>Pickup Location:</strong><br>
              Oyarifa, Accra
            </div>
          </div>

          <button type="submit">
            Continue to Payment
          </button>

        </form>

      </div>
    </div>
  </section>
  <script src="/store/assets/jsFiles/store-settings.js"></script>
  <script src="/store/assets/jsFiles/delivery.js?v=20260421-delivery-estimate"></script>
</body>
</html>
