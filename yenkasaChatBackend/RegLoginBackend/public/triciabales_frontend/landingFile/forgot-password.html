<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Yenkasa Store</title>
  <link rel="stylesheet" href="/store/assets/cssFile/style.css?v=20260416-store-profile">
</head>
<body>

  <div class="page-brand">
    <img src="/store/assets/images/YenkasaStoreLogo.png" alt="Yenkasa Store logo">
  </div>

  <section class="collection-section">
    <div class="section-header">
      <span>Account Recovery</span>
      <h2>Forgot Password</h2>
      <p>Enter your email and we will send you a reset link.</p>
    </div>

    <div class="card" style="max-width:600px;margin:0 auto;">
      <div class="card-content">
        <form id="forgotPasswordForm" style="display:flex;flex-direction:column;gap:18px;">
          <input type="email" id="resetEmail" placeholder="Email Address" required>
          <button type="submit">Send Reset Link</button>
        </form>

        <div id="forgotPasswordResult" style="margin-top:18px;"></div>
      </div>
    </div>
  </section>
  <script src="/store/assets/jsFiles/store-settings.js"></script>
  <script src="/store/assets/jsFiles/forgot-password.js"></script>
</body>
</html>
