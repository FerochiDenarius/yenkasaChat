<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin Login - Yenkasa Store</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f4f0e8, #f8f8f8);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-box {
      background: #fff;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
      width: 340px;
    }

    .login-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }

    .login-logo img {
      height: 64px;
      width: auto;
      display: block;
    }

    h2 {
      margin: 0 0 25px;
      text-align: center;
      color: #333;
      font-size: 26px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      border: 1px solid #d8d8d8;
      border-radius: 10px;
      font-size: 15px;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      outline: none;
      border-color: #b8860b;
      box-shadow: 0 0 0 3px rgba(184, 134, 11, 0.15);
    }

    button {
      width: 100%;
      padding: 14px;
      background: #b8860b;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover:not(:disabled) {
      background: #9f7309;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .loading-container {
      width: 100%;
      height: 6px;
      background: #eee;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 18px;
      display: none;
    }

    .loading-bar {
      width: 40%;
      height: 100%;
      background: #b8860b;
      border-radius: 999px;
      animation: slide 1s infinite ease-in-out;
    }

    @keyframes slide {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(250%);
      }
    }

    .loading-text {
      display: none;
      margin-top: 12px;
      text-align: center;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="login-logo">
      <img src="/triciabales_frontend/images/YenkasaStoreLogo.png" alt="Yenkasa Store logo">
    </div>

    <h2>Super Admin Login</h2>
    <p style="margin:0 0 20px;text-align:center;color:#666;font-size:14px;">
      Login to review all orders, monitor payouts and manage the marketplace.
    </p>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">

    <button id="loginBtn">Open Super Admin Dashboard</button>

    <div class="loading-container" id="loadingContainer">
      <div class="loading-bar"></div>
    </div>

    <div class="loading-text" id="loadingText">
      Logging in...
    </div>

    <p style="margin-top:18px;text-align:center;">
      <a href="/store/forgot-password">Forgot password?</a>
    </p>
  </div>

  <script src="login.js"></script>
</body>
</html>
