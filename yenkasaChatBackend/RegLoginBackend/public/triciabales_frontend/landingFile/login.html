<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Tricia Bales</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 320px;
    }

    h2 {
      margin-top: 0;
      text-align: center;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #b8860b;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .loading-container {
      width: 100%;
      height: 6px;
      background: #eee;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 15px;
      display: none;
    }

    .loading-bar {
      width: 0%;
      height: 100%;
      background: #b8860b;
      animation: loading 1.2s infinite ease-in-out;
    }

    @keyframes loading {
      0% {
        width: 0%;
      }
      50% {
        width: 75%;
      }
      100% {
        width: 100%;
      }
    }

    .loading-text {
      display: none;
      margin-top: 10px;
      text-align: center;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Admin Login</h2>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">

    <button id="loginBtn">Login</button>

    <div class="loading-container" id="loadingContainer">
      <div class="loading-bar"></div>
    </div>

    <div class="loading-text" id="loadingText">
      Logging in...
    </div>
  </div>

  <script>
    const loginBtn = document.getElementById("loginBtn");
    const loadingContainer = document.getElementById("loadingContainer");
    const loadingText = document.getElementById("loadingText");

    loginBtn.addEventListener("click", () => {
      loadingContainer.style.display = "block";
      loadingText.style.display = "block";
      loginBtn.disabled = true;
    });
  </script>

  <script src="login.js"></script>

</body>
</html>
