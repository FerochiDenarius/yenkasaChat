<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications | Yenkasa Store</title>
  <link rel="stylesheet" href="/store/assets/cssFile/style.css?v=20260416-logo-fill-cover">
</head>
<body>

  <div class="page-brand">
    <img src="/store/assets/images/YenkasaStoreLogo.png" alt="Yenkasa Store logo">
  </div>

  <section class="collection-section notifications-page">
    <div class="section-header">
      <span>Account Alerts</span>
      <h2 id="notificationsTitle">Notifications</h2>
      <p id="notificationsSubtitle">Order, payment, delivery and account activity will appear here.</p>
    </div>

    <div class="dashboard-menu compact-dashboard-menu">
      <a href="/store" class="tab-btn dashboard-menu-link">Store</a>
      <a href="/store/orders" class="tab-btn dashboard-menu-link" id="buyerOrdersLink">My Orders</a>
      <a href="/store/seller-dashboard" class="tab-btn dashboard-menu-link" id="sellerDashboardLink">Seller Dashboard</a>
      <a href="/store/super-admin" class="tab-btn dashboard-menu-link" id="superAdminLink">Super Admin</a>
      <button type="button" class="tab-btn active" id="refreshNotificationsBtn">Refresh</button>
    </div>

    <div class="notification-toolbar card">
      <div class="card-content">
        <div>
          <h3 id="notificationCountTitle">Loading notifications...</h3>
          <p id="notificationCountText">Checking your latest Yenkasa Store activity.</p>
        </div>
        <button type="button" class="primary-btn" id="markAllReadBtn">Mark All Read</button>
      </div>
    </div>

    <div id="notificationsFeedback" class="orders-feedback hidden"></div>
    <div class="notification-filter-bar" id="notificationFilterBar">
      <button type="button" class="notification-filter-btn active" data-notification-filter="all">All</button>
      <button type="button" class="notification-filter-btn" data-notification-filter="today">Today</button>
      <button type="button" class="notification-filter-btn" data-notification-filter="yesterday">Yesterday</button>
      <button type="button" class="notification-filter-btn" data-notification-filter="older">Older</button>
    </div>
    <div id="notificationsList" class="notifications-list"></div>
  </section>
  <script src="/store/assets/jsFiles/store-settings.js"></script>
  <script src="/store/assets/jsFiles/notifications.js?v=20260414-notification-groups"></script>
</body>
</html>
