<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Yenkasa Store</title>
  <link rel="stylesheet" href="/store/assets/cssFile/style.css?v=20260416-logo-fill-cover">
</head>
<body>

  <div class="page-brand">
    <img src="/store/assets/images/YenkasaStoreLogo.png" alt="Yenkasa Store logo" height="150" width="150">
  </div>

  <section class="collection-section">
    <div class="section-header">
      <span>Welcome</span>
      <h2>Create Your Account</h2>
      <p>Register as a buyer or seller</p>
    </div>

    <div class="card register-card-shell" style="max-width:780px;margin:0 auto;">
      <div class="card-content">

        <form id="register-form" class="register-form-modern">

          <div class="register-grid">
            <div class="modern-field">
              <label for="name">Full Name</label>
              <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
              >
            </div>

            <div class="modern-field">
              <label for="email">Email Address</label>
              <input
                type="email"
                id="email"
                placeholder="Enter your email address"
                required
              >
            </div>

            <div class="modern-field">
              <label for="phone">Phone Number</label>
              <input
                type="tel"
                id="phone"
                placeholder="Enter your phone number"
                required
              >
            </div>

            <div class="modern-field">
              <label for="role">Account Type</label>
              <select id="role" required>
                <option value="">Choose account type</option>
                <option value="BUYER">Buyer</option>
                <option value="SELLER">Seller</option>
              </select>
            </div>

            <div class="modern-field full">
              <label for="address">Residential Address</label>
              <textarea
                id="address"
                placeholder="Enter your residential address"
                rows="3"
                required
              ></textarea>
            </div>

            <div class="modern-field">
              <label for="referralCode">Referral Code</label>
              <input
                type="text"
                id="referralCode"
                placeholder="Optional referral code"
              >
            </div>

            <div class="modern-field">
              <label for="password">Password</label>
              <div class="password-field">
                <input
                  type="password"
                  id="password"
                  placeholder="Create a password"
                  required
                >
              </div>
            </div>
          </div>

          <div id="seller-kyc-fields" class="seller-kyc-panel hidden" aria-hidden="true">
            <div class="seller-kyc-header">
              <span>Seller KYC</span>
              <h3>Business verification details</h3>
              <p>These details are required for sellers before payouts can be approved.</p>
            </div>

            <div class="register-grid">
              <div class="modern-field">
                <label for="dateOfBirth">Date of Birth</label>
                <input type="date" id="dateOfBirth">
              </div>

              <div class="modern-field">
                <label for="idType">ID Type</label>
                <select id="idType">
                  <option value="">Choose ID type</option>
                  <option value="GHANA_CARD">Ghana Card</option>
                  <option value="PASSPORT">Passport</option>
                  <option value="DRIVERS_LICENSE">Driver's License</option>
                  <option value="VOTER_ID">Voter ID</option>
                  <option value="OTHER_GOVERNMENT_ID">Other Government ID</option>
                </select>
              </div>

              <div class="modern-field">
                <label for="idNumber">ID Number</label>
                <input
                  type="text"
                  id="idNumber"
                  placeholder="Enter ID number"
                >
              </div>

              <div class="modern-field">
                <label for="idImage">Upload ID Picture</label>
                <input
                  type="file"
                  id="idImage"
                  accept="image/*,.pdf"
                >
                <small class="register-field-help">Upload a clear photo or scan of the ID card.</small>
              </div>

              <div class="modern-field">
                <label for="shopName">Shop Name</label>
                <input
                  type="text"
                  id="shopName"
                  placeholder="Enter shop or business name"
                >
              </div>

              <div class="modern-field full">
                <label for="shopAddress">Shop Address / Location</label>
                <textarea
                  id="shopAddress"
                  placeholder="Enter the shop address, landmark, or location details"
                  rows="3"
                ></textarea>
              </div>

              <div class="modern-field full">
                <label for="proofOfOperation">Proof of Operation</label>
                <textarea
                  id="proofOfOperation"
                  placeholder="Describe how the shop operates, years in business, landmarks, or any verification notes"
                  rows="3"
                ></textarea>
              </div>
            </div>
          </div>

          <button type="submit" class="submit-btn">
            Create Account
          </button>

        </form>

        <p style="margin-top:20px;text-align:center;">
          Already have an account?
          <a href="/store/buyer-login">Login</a>
        </p>

      </div>
    </div>
  </section>
  <script src="/store/assets/jsFiles/store-settings.js"></script>
  <script src="/store/assets/jsFiles/password-toggle.js"></script>
  <script src="/store/assets/jsFiles/register.js?v=20260416-kyc-toggle-fix"></script>
</body>
</html>
