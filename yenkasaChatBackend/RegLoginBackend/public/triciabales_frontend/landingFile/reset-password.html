<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Yenkasa Store</title>
  <link rel="stylesheet" href="/store/assets/cssFile/style.css">
</head>
<body>

  <div class="page-brand">
    <img src="/store/assets/images/YenkasaStoreLogo.png" alt="Yenkasa Store logo">
  </div>

  <section class="collection-section">
    <div class="section-header">
      <span>Account Recovery</span>
      <h2>Reset Password</h2>
      <p>Set a new password for your account.</p>
    </div>

    <div class="card" style="max-width:600px;margin:0 auto;">
      <div class="card-content">
        <form id="resetPasswordForm" style="display:flex;flex-direction:column;gap:18px;">
          <input type="password" id="newPassword" placeholder="New Password" required>
          <button type="submit">Save New Password</button>
        </form>

        <div id="resetPasswordResult" style="margin-top:18px;"></div>
      </div>
    </div>
  </section>

  <script src="/store/assets/jsFiles/password-toggle.js"></script>
  <script src="/store/assets/jsFiles/reset-password.js"></script>
</body>
</html>
