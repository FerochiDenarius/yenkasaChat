<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Login | Yenkasa Store</title>
  <link rel="stylesheet" href="../cssFile/style.css">
</head>
<body>

  <div class="page-brand">
    <img src="../images/YenkasaStoreLogo.png" alt="Yenkasa Store logo">
  </div>

  <section class="collection-section">
    <div class="section-header">
      <span>Seller Access</span>
      <h2>Seller Login</h2>
      <p>Login to manage your products, orders and payouts.</p>
    </div>

    <div class="card" style="max-width:600px;margin:0 auto;">
      <div class="card-content">

        <form id="sellerLoginForm" style="display:flex;flex-direction:column;gap:18px;">

          <input
            type="email"
            id="email"
            placeholder="Email address"
            required
          >

          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          >

          <button type="submit">
            Open Seller Dashboard
          </button>

        </form>

        <p style="margin-top:20px;text-align:center;">
          Need a seller account?
          <a href="register.html">Register</a>
        </p>

        <p style="margin-top:12px;text-align:center;">
          <a href="forgot-password.html">Forgot password?</a>
        </p>

        <p style="margin-top:12px;text-align:center;">
          <button type="button" id="resendVerificationBtn" class="link-btn">
            Resend verification email
          </button>
        </p>

      </div>
    </div>
  </section>

  <script src="../jsFiles/seller-login.js"></script>
</body>
</html>
